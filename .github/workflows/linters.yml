name: Linters

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install flake8
      - name: flake8
        # Pinned to v2.0.0.
        uses: liskin/gh-problem-matcher-wrap@d8afa2cfb66dd3f982b1950429e652bc14d0d7d2
        with:
          linters: flake8
          run: flake8

  isort:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python -m pip install isort
      - name: isort
        # Pinned to v2.0.0.
        uses: liskin/gh-problem-matcher-wrap@d8afa2cfb66dd3f982b1950429e652bc14d0d7d2
        with:
          linters: isort
          run: isort --check --diff django tests scripts

  black:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Determine changed Python files
        id: changed_python
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py
      - name: Install black
        run: python -m pip install black
      - name: black --check changed files
        env:
          ADDED: ${{ steps.changed_python.outputs.added_files }}
          MODIFIED: ${{ steps.changed_python.outputs.modified_files }}
          SCRIPT: |
            import os
            import subprocess


            def parse(raw):
                return [segment for segment in raw.split() if segment]


            added = parse(os.environ.get("ADDED", ""))
            modified = parse(os.environ.get("MODIFIED", ""))

            files = sorted(set(added + modified))

            if not files:
                print("No added or modified Python files; skipping black.")
                raise SystemExit(0)

            print("Checking files:")
            for path in files:
                print(path)

            subprocess.run(["black", "--check", "--diff", *files], check=True)
        run: python -c "$SCRIPT"
